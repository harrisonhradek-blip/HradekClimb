{% extends "layout.html" %}

{% block title %}
    Climb Info
{% endblock %}

{% block main %}
    <h1 style="text-align: left; margin-bottom: 50px;">New Session</h1>
    <form method="post" action="/edit" style="text-align: left;">
    <input type="hidden" name="session_id" value="{{ session_id }}">

    {% for climb in climbs %}
        <h3 style="text-align: left; margin-top: 20px;">Climb {{ loop.index }}</h3>
        <input type="hidden" name="climb_id[]" value="{{ climb.climb_id }}">
        <div class="form-group">
            <label for="hours_{{ climb }}">How much time did you spend on this climb?</label>
            <input type="number" class="form-control" id="hours_{{ climb }}" value="{{ climb.hours }}" name="hours[]">
        </div>
        <div class="form-group">
            <label for="grade_{{ climb }}">What grade was this climb?</label>
            <select class="form-control" name="grade[]" id="grade_{{ climb }}">
                <option>{{ climb.grade }}</option>
                <option>V0</option>
                <option>V1</option>
                <option>V2</option>
                <option>V3</option>
                <option>V4</option>
                <option>V5</option>
                <option>V6</option>
                <option>V7</option>
                <option>V8</option>
                <option>V9</option>
                <option>V10</option>
                <option>V11</option>
                <option>V12</option>
                <option>V13</option>
                <option>V14</option>
                <option>V15</option>
                <option>V16</option>
                <option>V17</option>
            </select>
        </div>
        <div class="form-group">
            <label for="sent_{{ climb }}">Did you send it?</label>
            <select class="form-control" name="sent[]" id="sent_{{ climb }}">
            {% if climb.send == 0 %}
                <option>Not sent</option>
                <option value="yes">Sent</option>
            {% else %}
                <option value="yes">Sent</option>
                <option value="no">Not Sent</option>
            {% endif %}
            </select>
        </div>
        <div class="form-group">
            <label for="attempts_{{ climb }}">How many attempts did you do?</label>
            <input type="number" class="form-control" id="attempts_{{ climb }}" value="{{ climb.attempts }}" name="attempts[]">
        </div>
    {% endfor %}
        <button type="submit" class="btn btn-primary" style="margin-top: 20px;">Submit</button>
    </form>

{% endblock %}
