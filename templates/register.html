{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
<script>


</script>
<div class="center-vertical">
    <div class="d-flex align-items-center justify-content-center flex-wrap gap-5">

        <div class="text-start">
            <h1 class="display-4 fw-bold">HradekClimb</h1>
            <p class="text-muted">Track your climbs, sessions, and progress.</p>
        </div>

        <div class="card" style="width: 18rem;">
        <img class="card-img-top" src="/static/climbing.jpg" alt="Card image cap">
        <div class="card-body">
            <h5 class="card-title">Register</h5>
            <h6 class="card-subtitle mb-2 text-muted">Enter your username and password</h6>
                <form action="/register" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="username" class="form-control" id="username" name="username" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password">
                    <div id="confirmation" class="form-text">Never share your password with anyone else.</div>
                    <input type="confirmation" class="form-control" id="confirmation" placeholder="Confirmation" name="confirmation">
                </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin: 30px;">Submit</button>
                </form>
        </div>
        </div>
    </div>
</div>
{% endblock %}
